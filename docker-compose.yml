services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      ASAIP_DATABASE_URL: sqlite:////data/asaip.db
      ASAIP_CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      AI_PROVIDER: ${AI_PROVIDER:-auto}
      AI_MAX_TOKENS: ${AI_MAX_TOKENS:-16000}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-recursive/flint-v1.0:free}
      OPENROUTER_FALLBACK_MODELS: ${OPENROUTER_FALLBACK_MODELS:-cohere/north-mini-code:free,openrouter/free}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_APP_TITLE: ${OPENROUTER_APP_TITLE:-ASAIP}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-3-5-haiku-latest}
    volumes:
      - asaip-data:/data

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend

volumes:
  asaip-data:
